[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnb"
version = "0.1.0"
description = "Gemini Notebook Builder — lokalne narzędzie do przygotowania materiałów źródłowych dla Gemini Notebook."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kamszot666" }]

dependencies = [
    "charset-normalizer>=3.3",
    "EbookLib>=0.18",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "Pillow>=10.4",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "trafilatura>=2.0",
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.0",
]

[project.optional-dependencies]
# Obsługa obrazów HEIC i HEIF. Ich brak wyłącza wyłącznie te dwa formaty,
# a nie cały moduł obrazów, zgodnie z decyzją szóstą etapu ósmego.
obrazy-heic = [
    "pillow-heif>=0.18",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "lxml-stubs>=0.5",
    # Przypięte na mypy 1.13.0: nowsze wersje wymagają pakietu librt z natywnym
    # DLL, które zasady kontroli aplikacji Windows blokują na komputerze
    # deweloperskim. Odpiąć, gdy problem zniknie albo znajdzie się inne obejście.
    "mypy==1.13.0",
]

[project.scripts]
gnb = "gnb.cli:main"

[tool.setuptools.packages.find]
include = ["gnb*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["gnb"]
strict = true

# Biblioteki yt-dlp, ebooklib, pypdfium2, reportlab oraz pillow-heif nie
# dostarczają informacji o typach ani znacznika py.typed. Nasz kod opakowuje je
# wąskim adapterem z własnymi typami, więc brak ich typów nie rozlewa się na
# resztę pakietu.
[[tool.mypy.overrides]]
module = ["yt_dlp.*", "ebooklib.*", "pypdfium2.*", "reportlab.*", "pillow_heif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
# Tryb importu „importlib” pozwala mieć pliki testowe o tej samej nazwie
# w różnych katalogach, na przykład tests/core/test_youtube.py oraz
# tests/ingestion/test_youtube.py. W domyślnym trybie „prepend” takie pliki
# zderzają się przy zbieraniu testów, dopóki katalogi testów nie są pakietami.
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
markers = [
    "siec: test wymaga dostępu do sieci, domyślnie pominięty",
    "wolne: test jest długotrwały, domyślnie pominięty",
]
